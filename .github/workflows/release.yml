name: Publish release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Download Russian offline speech model
        shell: pwsh
        run: |
          Invoke-WebRequest https://alphacephei.com/vosk/models/vosk-model-small-ru-0.22.zip -OutFile vosk-ru.zip
          Expand-Archive vosk-ru.zip -DestinationPath SpeechModels
      - name: Publish
        run: dotnet publish -c Release -r win-x64 --self-contained true -o publish/win-x64
      - name: Create archive
        shell: pwsh
        run: Compress-Archive -Path publish/win-x64/* -DestinationPath DesmodAssistant-win-x64.zip
      - uses: softprops/action-gh-release@v2
        with:
          files: DesmodAssistant-win-x64.zip
          generate_release_notes: true
